; Export preset for the Scoundrel board frame (godot-plan.md, "Reproducible
; export"). Single-threaded Web, Compatibility renderer, custom shell.
; Consumed by `godot --headless --path godot --export-release Web <out>/board.html`
; via scripts/export-godot.mjs. Verified against the pinned 4.7.2 toolchain
; (godot/toolchain.json); placeholder/option names are re-checked whenever the
; pinned version changes.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Ship only the frame: no toolchain pin, staging manifest, or docs in the PCK.
exclude_filter="tests/*, toolchain.json, README.md, assets/manifest.json"
export_path="../public/godot/spike/board.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/board-shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/experimental_virtual_keyboard=false
html/focus_canvas=false
progressive_web_app/enabled=false
