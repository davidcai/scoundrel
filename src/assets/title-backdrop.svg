<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 216" role="img" aria-label="A torch-lit stone archway descending into darkness" shape-rendering="crispEdges">
  <defs>
    <!-- Stone brick wall: running bond, alternating vertical joints -->
    <pattern id="brick" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="16" fill="#211b34"/>
      <rect x="1" y="1" width="14" height="6" fill="#262040"/>
      <rect x="17" y="1" width="14" height="6" fill="#262040"/>
      <rect x="9" y="9" width="14" height="6" fill="#262040"/>
      <path d="M0 8.5h32M0 0.5h32M15.5 0v8M7.5 8v8M23.5 8v8" stroke="#0d0a17" stroke-width="1" fill="none"/>
    </pattern>
    <!-- Warm glow rising from the stairwell -->
    <radialGradient id="doorGlow" cx="50%" cy="82%" r="62%">
      <stop offset="0%" stop-color="#e07028" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#8f3a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#120b18" stop-opacity="0"/>
    </radialGradient>
    <!-- Torch halos (flicker via embedded CSS) -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc14d" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d7642b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d7642b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="55%" stop-color="#050408" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050408" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Arch ring: stepped blocks -->
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38304e"/>
      <stop offset="100%" stop-color="#241d38"/>
    </linearGradient>
    <style>
      .glow {
        animation: flick 1.5s steps(1, end) infinite;
      }
      .glow-r {
        animation-duration: 1.1s;
        animation-delay: 0.4s;
      }
      .flame {
        transform-origin: center bottom;
        transform-box: fill-box;
        animation: gutter 1.5s steps(1, end) infinite;
      }
      .flame-r {
        animation-duration: 1.1s;
        animation-delay: 0.4s;
      }
      @keyframes flick {
        0%, 100% { opacity: 0.6; }
        22% { opacity: 0.38; }
        44% { opacity: 0.68; }
        66% { opacity: 0.45; }
        88% { opacity: 0.62; }
      }
      @keyframes gutter {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        25% { transform: scaleY(0.86) scaleX(1.12); }
        50% { transform: scaleY(1.08) scaleX(0.92); }
        75% { transform: scaleY(0.94) scaleX(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow, .flame { animation: none; }
      }
    </style>
  </defs>

  <!-- Wall and floor -->
  <rect width="384" height="152" fill="url(#brick)"/>
  <rect y="152" width="384" height="64" fill="#171126"/>
  <rect y="148" width="384" height="4" fill="#0c0917"/>

  <!-- Wall cracks -->
  <g fill="#0c0917">
    <rect x="42" y="40" width="2" height="14"/>
    <rect x="44" y="52" width="6" height="2"/>
    <rect x="318" y="24" width="2" height="10"/>
    <rect x="312" y="34" width="8" height="2"/>
    <rect x="96" y="8" width="2" height="8"/>
  </g>

  <!-- Archway: stepped stone rings -->
  <g fill="url(#stone)" stroke="#0c0917" stroke-width="2">
    <!-- outer ring -->
    <path d="M128 152 V80 h8 v-8 h8 v-8 h8 v-8 h8 v-8 h64 v8 h8 v8 h8 v8 h8 v8 h8 v8 h8 v72 Z"/>
    <!-- inner ring -->
    <path d="M144 152 V88 h6 v-6 h6 v-6 h6 v-6 h6 v-6 h48 v6 h6 v6 h6 v6 h6 v6 h6 v64 Z" fill="#2a2140"/>
  </g>

  <!-- The way down: darkness with ember glow and stairs -->
  <g>
    <path d="M156 152 V94 h5 v-5 h5 v-5 h5 v-5 h5 v-5 h32 v5 h5 v5 h5 v5 h5 v5 h5 v58 Z" fill="#0a0710"/>
    <path d="M156 152 V94 h5 v-5 h5 v-5 h5 v-5 h5 v-5 h32 v5 h5 v5 h5 v5 h5 v5 h5 v58 Z" fill="url(#doorGlow)"/>
    <g fill="#070510">
      <rect x="166" y="126" width="52" height="4"/>
      <rect x="162" y="138" width="60" height="4"/>
      <rect x="158" y="148" width="68" height="4"/>
    </g>
  </g>

  <!-- Keystone skull -->
  <g>
    <rect x="188" y="46" width="8" height="10" fill="#cfc4a0"/>
    <rect x="189.5" y="49" width="2" height="3" fill="#241d38"/>
    <rect x="192.5" y="49" width="2" height="3" fill="#241d38"/>
    <rect x="190.5" y="54" width="3" height="2" fill="#241d38"/>
  </g>

  <!-- Torch halos -->
  <circle class="glow" cx="76" cy="88" r="46" fill="url(#halo)"/>
  <circle class="glow glow-r" cx="308" cy="88" r="46" fill="url(#halo)"/>

  <!-- Torches -->
  <g>
    <rect x="74" y="98" width="4" height="22" fill="#3a2c1c"/>
    <rect x="70" y="94" width="12" height="6" fill="#241d38" stroke="#0c0917"/>
    <g class="flame">
      <rect x="72" y="84" width="8" height="10" fill="#d7642b"/>
      <rect x="74" y="80" width="4" height="6" fill="#ffc14d"/>
      <rect x="74" y="88" width="4" height="6" fill="#ffc14d"/>
    </g>
  </g>
  <g>
    <rect x="306" y="98" width="4" height="22" fill="#3a2c1c"/>
    <rect x="302" y="94" width="12" height="6" fill="#241d38" stroke="#0c0917"/>
    <g class="flame flame-r">
      <rect x="304" y="84" width="8" height="10" fill="#d7642b"/>
      <rect x="306" y="80" width="4" height="6" fill="#ffc14d"/>
      <rect x="306" y="88" width="4" height="6" fill="#ffc14d"/>
    </g>
  </g>

  <!-- Loot scraps on the floor -->
  <g fill="#cfc4a0">
    <rect x="104" y="158" width="6" height="4"/>
    <rect x="106" y="160" width="2" height="2" fill="#171126"/>
  </g>
  <g fill="#b0812a">
    <rect x="262" y="160" width="4" height="4"/>
    <rect x="268" y="162" width="4" height="4"/>
  </g>

  <rect width="384" height="216" fill="url(#vignette)"/>
</svg>
