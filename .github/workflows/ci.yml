name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unit & integration tests don't need a build; run them first so
      # failures surface before paying the build cost.
      - name: Unit & integration tests
        run: pnpm test

      # pnpm build = typecheck (tsc -b) + bundle. Must run before e2e:
      # playwright preview serves dist/.
      - name: Build (typecheck + bundle)
        run: pnpm build

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved Playwright version so only a Playwright
      # upgrade (direct or transitive) churns the cache. restore-keys falls
      # back to the previous version's browsers on a miss and `playwright
      # install` fetches the missing revision.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # Assumes the default PLAYWRIGHT_BROWSERS_PATH (~/.cache/ms-playwright).
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Save is split from restore so a failed install never persists a
      # partial cache. Skipped on an exact-key hit (nothing to save);
      # continue-on-error tolerates a concurrent run saving the same key.
      - name: Save Playwright browsers
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright artifacts on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
