# Continuous integration for the standalone Scoundrel delivery branch.
# This workflow only verifies the build; it never deploys. Publishing requires
# explicit authorization separately from the hosting decision.
name: CI

on:
  push:
    branches: [ds/game-implementation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04 instead of ubuntu-latest so the whole
# pipeline is reproducible. Playwright 1.64.1's WebKit build (webkit-2370)
# needs Ubuntu 24.04's ICU 74 (libicudata.so.74); ubuntu-latest migrated to
# Ubuntu 26 on 2026-10-19, where WebKit fails to launch. Both jobs share the
# same image; revisit this pin when Playwright is upgraded.
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # pnpm 11.7.0 and Node.js 22 come from package.json "packageManager"
      # and "engines"; the branch is verified on the supported Node.js 22 LTS.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # `pnpm build` also type-checks, so a broken build fails before the gate.
      - name: Build production bundle
        run: pnpm build

      - name: Bundle size budget
        run: pnpm bundle-size

  # Browser checks run against the production build. The job is split into two
  # parallel shards so Chromium coverage does not wait for WebKit/Firefox, and
  # both shards start alongside the fast `ci` gate instead of after it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chromium
            projects: '--project=chromium-wide --project=chromium-medium --project=chromium-compact --project=chromium-narrow'
            browsers: chromium
          - lane: webkit-firefox
            projects: '--project=webkit-wide --project=webkit-compact --project=webkit-narrow --project=firefox-wide'
            browsers: webkit firefox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}

      - name: Build production bundle
        run: pnpm build

      - name: Run end-to-end checks (${{ matrix.lane }})
        run: pnpm e2e ${{ matrix.projects }}

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
