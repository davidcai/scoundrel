# Continuous integration for the standalone Scoundrel delivery branch.
# This workflow only verifies the build; it never deploys. Publishing requires
# explicit authorization separately from the hosting decision.
name: CI

on:
  push:
    branches: [ds/game-implementation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04 instead of ubuntu-latest so the whole
# pipeline is reproducible; both jobs share the same image.
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # pnpm 11.7.0 and Node.js 22 come from package.json "packageManager"
      # and "engines"; the branch is verified on the supported Node.js 22 LTS.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # `pnpm build` also type-checks, so a broken build fails before the gate.
      - name: Build production bundle
        run: pnpm build

      - name: Bundle size budget
        run: pnpm bundle-size

  # Browser checks run against the production build. Chrome is the only
  # supported browser, so this job installs only Chromium and starts alongside
  # the fast `ci` gate instead of waiting behind it.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production bundle
        run: pnpm build

      - name: Run end-to-end checks
        run: pnpm e2e

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
